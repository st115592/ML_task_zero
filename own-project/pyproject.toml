[project]
name = "ml-mechanics-orbit-comparison"
version = "0.1.0"
description = "Reproducible comparison of basic orbit integrators"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "ty>=0.0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ty.environment]
python-version = "3.10"
