name: Python verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: own-project/requirements-lock.txt
      - name: Install pinned verification tools
        run: python -m pip install -r requirements-lock.txt
        working-directory: own-project
      - name: Run unit and integration tests
        run: python -m pytest tests -q
        working-directory: own-project
      - name: Check formatting
        run: python -m ruff format --check orbit_sim.py report_tools.py tests
        working-directory: own-project
      - name: Lint
        run: python -m ruff check orbit_sim.py report_tools.py tests
        working-directory: own-project
      - name: Static type check
        run: python -m ty check orbit_sim.py report_tools.py
        working-directory: own-project
      - name: Check report and experiment artifacts
        run: python report_tools.py
        working-directory: own-project
